name: Build Mobile Game APK
on: [push, workflow_dispatch]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Files
        uses: actions/checkout@v5

      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix loose script paths
        run: |
          sed -i 's|res://scripts/|res://|g' main.tscn || true
          sed -i 's|res://scripts/|res://|g' *.gd || true

      - name: Download Engine Binaries
        run: |
          curl -L -o godot.zip https://github.com
          unzip godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          
          curl -L -o templates.tpz https://github.com
          unzip templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Compile Game APK
        run: |
          ./godot --headless --export-release "Android" ./MASK_Game.apk

      - name: Save APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: ./*.apk
          
