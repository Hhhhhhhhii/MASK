
name: Build MASK Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HOME: ${{ github.workspace }}/.ci-home
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-home/.config

    steps:
      # 1. Download project source
      - name: Checkout Source Files
        uses: actions/checkout@v5

      # 2. Setup Java 17
      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Android SDK components
      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      # 5. Prepare writable Godot directories
      - name: Prepare Godot Environment
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot"
          mkdir -p "$GITHUB_WORKSPACE/.godot/editor"

          chmod -R u+rwX "$GITHUB_WORKSPACE"

          rm -rf "$GITHUB_WORKSPACE/.godot"

          mkdir -p "$GITHUB_WORKSPACE/.godot/editor"

      # 6. Download Godot 4.3
      - name: Download Godot Engine
        run: |
          curl -fL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip

          unzip -q godot.zip

          mv Godot_v4.3-stable_linux.x86_64 godot

          chmod +x godot

      # 7. Download Android export templates
      - name: Download Godot Export Templates
        run: |
          curl -fL -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          unzip -q templates.tpz

          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"

          cp -a templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      # 8. Import project using editor mode
      - name: Import Godot Project
        run: |
          ./godot --headless --editor \
            --path "$GITHUB_WORKSPACE" \
            --import

      # 9. Verify project permissions
      - name: Verify Godot Project
        run: |
          mkdir -p .godot/editor
          chmod -R u+rwX .godot

          test -w .godot/editor

          echo "Godot project directory is writable."

      # 10. Prepare APK output
      - name: Prepare APK Output
        run: |
          mkdir -p build

      # 11. Export Android APK in editor mode
      - name: Export MASK Android APK
        run: |
          ./godot --headless --editor \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" build/MASK.apk

      # 12. Verify APK
      - name: Verify APK
        run: |
          if [ ! -s build/MASK.apk ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL"
          ls -lh build/MASK.apk

      # 13. Upload APK to GitHub
      - name: Upload MASK APK
        uses: actions/upload-artifact@v4
        with:
          name: MASK-Android-APK
          path: build/MASK.apk
          if-no-files-found: error
          retention-days: 14
          
